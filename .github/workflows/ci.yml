name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff
      - run: ruff check assistant smart_assistant_project task0.py
      - run: ruff format --check assistant smart_assistant_project task0.py
      - run: python manage.py check
      - run: python manage.py test assistant
  native-lstm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt tensorflow==2.21.0
      - run: python manage.py test assistant.test_engineering.EngineeringTests.test_native_lstm_real_inference_contract
